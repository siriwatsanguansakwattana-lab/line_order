<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Order Menu</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body{
  font-family: sans-serif;
  padding: 15px;
}

/* กล่องสินค้า */
.item{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

/* ฝั่งปุ่ม */
.controls{
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ปุ่มกลม (+ -) */
.circle{
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  font-size: 18px;
  cursor: pointer;

  /* ทำให้ + อยู่ตรงกลางเป๊ะ */
  display: flex;
  justify-content: center;
  align-items: center;

  padding: 0;
  line-height: 1;

  background: #eee;
}

.circle:active{
  background: #ccc;
}

/* จำนวน */
.count{
  min-width: 24px;
  text-align: center;
  font-size: 16px;
}

/* ปุ่มส่ง */
.finish-btn{
  margin-top: 20px;
  width: 100%;
  background: #06c755;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 12px;
  font-size: 16px;
}
</style>

</head>

<body>

<h3>เลือกสินค้า</h3>

<div class="item">
  <p>ชิฟฟ่อนมะพร้าว</p>
  <div class="controls">
    <button class="circle" onclick="updateItem('ชิฟฟ่อนมะพร้าว', -1)">-</button>
    <span id="count-ชิฟฟ่อนมะพร้าว" class="count">0</span>
    <button class="circle" onclick="updateItem('ชิฟฟ่อนมะพร้าว', 1)">+</button>
  </div>
</div>

<div class="item">
  <p>ชิฟฟ่อนมะพร้าวมีไส้</p>
  <div class="controls">
    <button class="circle" onclick="updateItem('ชิฟฟ่อนมะพร้าวมีไส้', -1)">-</button>
    <span id="count-ชิฟฟ่อนมะพร้าวมีไส้" class="count">0</span>
    <button class="circle" onclick="updateItem('ชิฟฟ่อนมะพร้าวมีไส้', 1)">+</button>
  </div>
</div>

<button class="finish-btn" onclick="finishOrder()">
เสร็จสิ้น
</button>

<script>

let cart = {};

async function init(){
  await liff.init({
    liffId: "2009962426-MPtoZcTX"
  });
}

init();

function updateItem(item, change){

  if(!cart[item]){
    cart[item] = 0;
  }

  cart[item] += change;

  if(cart[item] < 0){
    cart[item] = 0;
  }

  document.getElementById("count-"+item).innerText = cart[item];
}

function finishOrder(){

  let msg = "รายการสั่งซื้อ\n";
  let hasItem = false;

  for(let item in cart){
    if(cart[item] > 0){
      msg += "- " + item + " x" + cart[item] + "\n";
      hasItem = true;
    }
  }

  if(!hasItem){
    alert("ยังไม่ได้เลือกสินค้า");
    return;
  }

  liff.sendMessages([
    {
      type: "text",
      text: msg
    }
  ]).then(()=>{
    liff.closeWindow();
  });

}

</script>

</body>
</html>
